<main class="wrap"><div class="hero"><div class="eyebrow">LIVE SYSTEM MONITOR</div><h1>실시간 <span class="gradient">봇 상태</span></h1><p class="sub">ARαNX 상태 API를 통해 봇 연결과 가동 시간을 확인합니다. 10초마다 자동 갱신됩니다.</p></div>
<div class="grid"><article class="card"><div class="icon" id="status-icon">…</div><h2>봇 상태</h2><p class="value" id="bot-state" role="status">상태 확인 준비 중</p></article><article class="card"><div class="icon">↯</div><h2>응답 시간</h2><p class="value" id="bot-ping">—</p></article><article class="card"><div class="icon">◷</div><h2>가동 시간</h2><p class="value" id="bot-uptime">—</p></article><article class="card"><div class="icon">⟳</div><h2>마지막 확인</h2><p class="value" id="bot-checked">—</p></article></div>

<script>
const STATUS_API_URL = "https://feb-oem-indicates-lobby.trycloudflare.com/api/status";
const REFRESH_MS = 10000;
const $ = id => document.getElementById(id);
function duration(value){if(typeof value==="string"&&value.trim())return value;const sec=Math.max(0,Math.floor(Number(value)||0));const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;return(d?d+"일 ":"")+(h?h+"시간 ":"")+(m?m+"분 ":"")+s+"초"}
async function refreshStatus(){const started=performance.now();try{const response=await fetch(STATUS_API_URL,{cache:"no-store",headers:{"Accept":"application/json"}});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();const ping=Math.round(performance.now()-started);const running=data.running===true||data.online===true||data.connected===true||data.status==="online"||data.status==="running";$("bot-state").textContent=running?"온라인 · 켜짐":"오프라인 · 꺼짐";$("status-icon").textContent=running?"●":"○";$("bot-ping").textContent=ping+" ms";const uptime=data.uptimeSeconds??data.uptime_seconds??data.uptime??data.processUptime;$("bot-uptime").textContent=uptime==null?"API 응답에 가동 시간 값이 없음":duration(uptime);$("bot-checked").textContent=new Date().toLocaleTimeString("ko-KR");$("status-note").textContent="상태 API 연결됨 · "+(data.message||"자동으로 10초마다 갱신됩니다.")}catch(error){$("bot-state").textContent="봇이 종료됨";$("status-icon").textContent="○";$("bot-ping").textContent="—";$("bot-uptime").textContent="—";$("bot-checked").textContent=new Date().toLocaleTimeString("ko-KR");$("status-note").textContent="ARαNX 봇이 종료되었거나 상태 서버에 연결할 수 없습니다."}}
refreshStatus();setInterval(refreshStatus,REFRESH_MS);
</script>
