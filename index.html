<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ef">
  <title>PROASIS</title>
  <meta name="description" content="PROASIS">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;background:#f4f3ef;color:#17191d;display:grid;place-items:center}
    main{width:min(100% - 40px,760px);min-height:100vh;display:grid;place-items:center}
    .brand{display:flex;flex-direction:column;align-items:center;gap:27px}
    svg{width:min(52vw,230px);height:auto;overflow:visible}
    .wordmark{font-size:clamp(27px,6vw,43px);font-weight:650;letter-spacing:.24em;padding-left:.24em}
    .rule{width:34px;height:1px;background:#b8b7b1}
    @media(prefers-reduced-motion:no-preference){.brand{animation:appear 1s ease both}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="PROASIS">

        <g fill="none" stroke="#20252c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

          <path d="m132 47 38-15 29 31-18 38-43-2-19-21"/>
          <path d="m74 130 25 27 42-5 18-29-21-24"/>
          <path d="M95 89c14-15 28-18 42-10 13 8 19 23 16 39-3 17-17 29-35 31"/>
        </g>
        <path d="m105 29 27 18-13 31-28 17-17 35-26-19" fill="#20252c" opacity=".08"/>
        <path d="M151 109c14-3 25 1 33 12" fill="none" stroke="#20252c" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div class="wordmark">PROASIS</div>
      <div class="rule"></div>
    </div>
  </main>
</body>
</html>
